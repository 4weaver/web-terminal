<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content is what makes the soft keyboard reflow the
     layout instead of overlaying it. This is the mobile behavior ttyd lacks. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>terminal</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="terminal"></div>

<!-- Key row: Esc is the key mobile keyboards cannot produce. Ctrl is a sticky
     latch, so Ctrl then c sends 0x03. -->
<div id="keys">
  <button type="button" data-key="esc">esc</button>
  <button type="button" data-mod="ctrl">ctrl</button>
  <button type="button" data-arrow="up">↑</button>
  <button type="button" data-arrow="down">↓</button>
  <button type="button" data-arrow="left">←</button>
  <button type="button" data-arrow="right">→</button>
  <button type="button" data-key="tab">tab</button>
  <button type="button" data-key="ctrlc">^c</button>
</div>
<div id="status">connecting…</div>

<script type="module">
import { init, Terminal, FitAddon } from './vendor/ghostty-web.js';
import { TerminalConnection } from './connection.js';
import { attachImeInputForwarding } from './ime-input.js';
import { attachImePreedit } from './ime-preedit.js';
import { attachMouseInput } from './mouse-input.js';
import {
  FONTS, THEMES, loadConfig, loadFont, fontStack,
  clampSize, readDelta, nextSize, sizeHotkey, withCanvasAlpha,
} from './appearance.js';

const appearance = await loadConfig();
const theme = THEMES[appearance.theme];
const font = FONTS[appearance.font];
document.documentElement.style.setProperty('--term-bg', theme.background);
await loadFont(appearance.font);

await init();

const fit = new FitAddon();
let fitTimer = 0;
const scheduleFit = () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => fit.fit(), 100);
};

const term = new Terminal({
  cursorBlink: true,
  fontSize: clampSize(appearance.fontSize, readDelta(localStorage)),
  fontFamily: fontStack(font.family),
  theme,
  scrollback: 10000,
  allowTransparency: appearance.alpha,
});
const terminalEl = document.getElementById('terminal');

term.loadAddon(fit);
withCanvasAlpha(appearance.alpha, () => term.open(terminalEl));
fit.fit();
fit.observeResize();

// ghostty focuses the contenteditable container, whose beforeinput is prevented;
// the textarea is the edit target. The editable container also gives a long press
// the OS magnifier + selection handles, which fight the touch drag.
term.textarea?.focus();
terminalEl.removeAttribute('contenteditable');

const enc = new TextEncoder();
const status = document.getElementById('status');

const conn = new TerminalConnection({
  onOutput: (bytes) => term.write(bytes),
  onReset: () => term.reset(),
  onState: (s) => { status.textContent = s; status.dataset.state = s; },
  onExit: (code) => { status.textContent = `exited (${code})`; },
  onLatency: () => {},
  onSession: (id) => { status.dataset.session = id; },
});

// Send input straight through. ghostty-web's own encoder already handles Ctrl
// combinations — no custom key handler, which is exactly where web-terminal's
// mobile Ctrl bug lived.
term.onData((data) => conn.sendInput(data));
term.onResize(({ cols, rows }) => conn.sendResize(cols, rows));

// input paths ghostty-web lacks: non-composing IME commits, mouse reports
attachImeInputForwarding(terminalEl, (data) => conn.sendInput(data));
attachImePreedit(terminalEl, term);
attachMouseInput(terminalEl, term, (data) => conn.sendInput(data));

conn.connect(term.cols, term.rows);

// --- key row ---------------------------------------------------------------
let ctrlLatched = false;
const ctrlBtn = document.querySelector('[data-mod="ctrl"]');
function setLatch(on) {
  ctrlLatched = on;
  ctrlBtn.dataset.active = String(on);
}
function send(bytes) { conn.sendInput(bytes); }

function applyFontSize(px) {
  if (term.options.fontSize === px) return;
  term.options.fontSize = px;
  scheduleFit();
}
window.addEventListener("keydown", (event) => {
  const kind = sizeHotkey(event, { ctrlLatched });
  if (kind === null) return;
  event.preventDefault();
  event.stopPropagation();
  applyFontSize(nextSize(kind, appearance.fontSize, localStorage));
  setLatch(false);
}, true);

document.getElementById('keys').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  e.preventDefault();
  if (btn.dataset.mod === 'ctrl') { setLatch(!ctrlLatched); return; }
  if (ctrlLatched && btn.dataset.key && btn.dataset.key.length === 1) {
    send(String.fromCharCode(btn.dataset.key.toUpperCase().charCodeAt(0) & 0x1f));
    setLatch(false);
    return;
  }
  const map = { esc: '\x1b', tab: '\t', ctrlc: '\x03' };
  if (btn.dataset.key) { send(map[btn.dataset.key] ?? ''); setLatch(false); return; }
  const arrows = { up: '\x1b[A', down: '\x1b[B', right: '\x1b[C', left: '\x1b[D' };
  if (btn.dataset.arrow) { send(arrows[btn.dataset.arrow]); setLatch(false); }
});

// IME-delivered keys (Trime and others) arrive with an empty event.code, because
// the IME injects a KeyEvent with no hardware scan code for the browser to map.
// ghostty-web's encoder is keyed on event.code — mapKeyCode() is a plain lookup
// that returns null for "", and handleKeyDown() then returns without sending
// anything. So EVERY such key is dropped: arrows, Insert, Delete, Esc, Tab, and
// Ctrl combinations (whose isPrintableCharacter() is also false when ctrlKey is
// set). Measured on the device: Ctrl sends code="", keyCode=67; ArrowUp sends
// code="", keyCode=38. A desktop keyboard populates code, so it is unaffected —
// which is why the empty-code check is the correct trigger and nothing else is.
//
// Everything here is therefore keyed on keyCode, never event.code.
const NAMED_KEYS = {
  33: '\x1b[5~', // PageUp
  34: '\x1b[6~', // PageDown
  35: '\x1b[F',  // End
  36: '\x1b[H',  // Home
  37: '\x1b[D',  // Left
  38: '\x1b[A',  // Up
  39: '\x1b[C',  // Right
  40: '\x1b[B',  // Down
  45: '\x1b[2~', // Insert
  46: '\x1b[3~', // Delete
  9: '\t',       // Tab
  13: '\r',      // Enter
  27: '\x1b',    // Escape
  8: '\x7f',     // Backspace — xterm sends DEL, not BS
};

term.attachCustomKeyEventHandler((event) => {
  if (event.type !== 'keydown') return false;

  // Only take over keys the encoder cannot handle. A non-empty code means a
  // real keyboard, which the encoder handles correctly — leave it alone.
  if (event.code === '') {
    const named = NAMED_KEYS[event.keyCode];
    if (named !== undefined) {
      send(named);
      setLatch(false);
      return true;
    }
    if (event.ctrlKey && !event.metaKey) {
      // Ctrl+A-Z -> the classic control byte. Ctrl+Alt folds the same way (an
      // ESC prefix is the readline/emacs convention for Alt, but Alt+Ctrl is
      // not vocabulary any terminal binds, and emitting a bare letter here —
      // which is what the encoder did — is plainly wrong.
      if (event.keyCode >= 65 && event.keyCode <= 90) {
        send(String.fromCharCode(event.keyCode & 0x1f));
        setLatch(false);
        return true;
      }
      if (event.keyCode === 219) { // Ctrl+[
        send('\x1b');
        setLatch(false);
        return true;
      }
    }
    if (event.altKey && !event.ctrlKey && !event.metaKey && event.key.length === 1) {
      // Alt/Meta is an ESC prefix, the standard convention.
      send('\x1b' + event.key);
      setLatch(false);
      return true;
    }
  }

  // A latched Ctrl applies to the next hardware keypress too.
  if (!ctrlLatched) return false;
  if (event.ctrlKey || event.altKey || event.metaKey) return false;
  const ch = event.key;
  if (ch.length !== 1) return false;
  send(String.fromCharCode(ch.toUpperCase().charCodeAt(0) & 0x1f));
  setLatch(false);
  return true;
});

// Keep the terminal fitted when the soft keyboard opens.
window.visualViewport?.addEventListener('resize', () => fit.fit());
</script>
</body>
</html>
